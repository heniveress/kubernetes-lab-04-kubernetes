apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coffee-db-data
  namespace: heni
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-db
  namespace: heni
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: coffee-db }
  template:
    metadata:
      labels: { app: coffee-db }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: coffee-db }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: coffee-db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-db
  namespace: heni
spec:
  selector: { app: coffee-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: heni
spec:
  replicas: 1
  selector:
    matchLabels: { app: myapp }
  template:
    metadata:
      labels: { app: myapp }
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: myapp
          image: heniveress/kuberneteslab04:coffee-log
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: coffee-db, key: POSTGRES_DB } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://coffee-db:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: coffee-db, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: coffee-db, key: POSTGRES_PASSWORD } }
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: heni
spec:
  selector: { app: myapp }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: heni
spec:
  ingressClassName: traefik
  rules:
    - host: myapp.heni.sapi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: myapp, port: { number: 80 } }
  tls:
    - hosts: [myapp.heni.sapi.click]