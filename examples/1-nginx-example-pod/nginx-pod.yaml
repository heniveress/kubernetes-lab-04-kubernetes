# The most basic thing that can work: ONE bare Pod running nginx, exposed at
# https://pod.heni.sapi.click
#
# A bare Pod is NOT managed by any controller.  If it crashes, or the node it
# runs on reboots, it is simply gone and nothing recreates it.  That is why the
# second example (../2-nginx-example-deployment) uses a Deployment instead.
#
# No TLS annotation is needed: Traefik obtains a Let's Encrypt certificate for
# the Ingress host automatically, and external-dns publishes the A record.
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: heni
  labels: { app: nginx-pod }
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-pod
  namespace: heni
spec:
  selector: { app: nginx-pod }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-pod
  namespace: heni
spec:
  ingressClassName: traefik
  rules:
    - host: henipod.sapi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-pod
                port:
                  number: 80
  tls:
    - hosts:
        - henipod.sapi.click
