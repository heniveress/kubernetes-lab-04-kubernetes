# Private-registry pull credential for darktohka/protected-image.
#
# .dockerconfigjson below is the content of ~/.docker/config.json, i.e. the
# darktohka Docker Hub credential (base64 user:token).  IT IS A SECRET -- treat
# this file like a password, and note that any Pod in the `dani` namespace can
# read it back.
#
# Recreate/rotate it without editing this file (recommended, use a READ-ONLY token):
#   kubectl -n dani create secret docker-registry dockerhub-pull --docker-server=https://index.docker.io/v1/ --docker-username=darktohka --docker-password=<read-only-token> --dry-run=client -o yaml | kubectl apply -f -
#
# A Pod uses it via:  spec.template.spec.imagePullSecrets: [{ name: dockerhub-pull }]
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-pull
  namespace: heni
  labels:
    app.kubernetes.io/part-of: protected-image-example
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {"auths":{"https://index.docker.io/v1/":{"auth":"..."}}}
